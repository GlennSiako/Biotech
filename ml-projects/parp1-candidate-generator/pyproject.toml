[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parp1-candidate-generator"
version = "0.1.0"
description = "CPU-friendly PARP1 activity modeling and candidate generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "rdkit",
  "requests",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
