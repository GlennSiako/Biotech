limitations:
  - "This manifest contains manually extracted study summaries, not harmonized raw data."
  - "Results from different vector, construct, plant, harvest, and assay contexts are not directly exchangeable."
  - "Percent total soluble protein is not convertible to mass per fresh weight without additional measurements."
