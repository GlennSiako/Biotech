          - "universal localization ranking"
      - claim_id: "tw2014_codon_vacuole_34pct"
        evidence_grade: "E1"
        claim: "Host-adapted coding increased the vacuole-targeted hEGF yield by approximately 34 percent in the reported comparison."
        value:
          estimate: 34
          unit: "percent relative increase"
          qualifier: "approximately"
        eligible_for:
          - "study-conditioned effect prior"
        not_for:
          - "effect transfer to other construct contexts"
      - claim_id: "tw2014_codon_er_no_gain"
        evidence_grade: "E2"
        claim: "The same coding adaptation did not improve the ER-targeted condition in the reported comparison."
        eligible_for:
