  - "Numerical simulator parameters remain S0 unless a calibration record explicitly links them to source-level data."

evidence_grades:
  E1: "Direct quantitative result reported by a primary source."
  E2: "Direct qualitative result reported by a primary source."
  E3: "Result available only through a secondary source."
  S0: "Synthetic PhytoForge assumption."

