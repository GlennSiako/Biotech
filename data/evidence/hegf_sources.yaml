known_evidence_gaps:
  - gap_id: "raw_replicates"
    description: "Source-level replicate tables suitable for hierarchical calibration have not yet been assembled."
    consequence: "Version 0 cannot estimate biological variance from these summaries."
  - gap_id: "yield_unit_bridge"
    description: "No validated conversion between percent total soluble protein and mass per fresh weight is available across study contexts."
    consequence: "The two outcome types remain jointly modeled but separately observed."
  - gap_id: "downstream_mass_balance"
    description: "Step-level target recovery and impurity-removal measurements are incomplete."
    consequence: "Extraction and purification efficiencies remain synthetic priors."
  - gap_id: "activity_standardization"
    description: "Activity evidence comes from study-specific cell assays with different designs and controls."
    consequence: "Version 0 uses an activity-retention proxy rather than a calibrated potency model."
  - gap_id: "prospective_validation"
    description: "No blinded prospective partner dataset exists."
    consequence: "The benchmark cannot exceed calibration tier S1."

