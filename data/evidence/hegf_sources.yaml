      - claim_id: "tw2014_p19_over_threefold"
        evidence_grade: "E1"
        claim: "The silencing-suppression context increased expression by more than threefold in the reported study context."
        value:
          lower_bound: 3
          unit: "fold change"
          bound_type: "exclusive_lower"
        eligible_for:
          - "broad study-conditioned effect prior"
        not_for:
          - "exact point calibration"
      - claim_id: "tw2014_plant_age_five_week"
        evidence_grade: "E2"
        claim: "Five-week-old plants produced significantly more hEGF than four- or six-week-old plants in the reported comparison."
        eligible_for:
          - "study-conditioned ordinal prior"
      - claim_id: "tw2014_combined_6_24_tsp"
        evidence_grade: "E1"
        claim: "The combined optimized condition produced an average hEGF yield of 6.24 percent of total soluble protein."
        value:
          estimate: 6.24
          unit: "percent total soluble protein"
          statistic: "average"
        eligible_for:
          - "broad literature-emulation interval"
        not_for:
          - "cross-study mass conversion"
          - "commercial yield claim"
      - claim_id: "tw2014_activity_comparable"
        evidence_grade: "E2"
        claim: "Plant-made hEGF promoted mouse keratinocyte proliferation comparably to the commercial E. coli-derived hEGF control used in the study."
        eligible_for:
          - "qualitative activity-retention prior"
        not_for:
          - "clinical efficacy"
          - "general assay equivalence"

